<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the app can paint into the notch area; the safe
         area insets are honoured in CSS rather than by letterboxing. Note there
         is no maximum-scale/user-scalable=no — pinch zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#6c4cf1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c18" />
    <meta name="color-scheme" content="light dark" />

    <title>InternLink — Internships & Entry-Level Roles</title>
    <meta
      name="description"
      content="Find internships and entry-level roles that match your skills, or hire the interns who will grow your team."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InternLink" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&display=swap"
    />

    <script>
      // Runs before first paint. Without this, a dark-mode user gets a white
      // flash on every cold load — the single most noticeable quality tell in
      // an installed PWA.
      (function () {
        try {
          var stored = localStorage.getItem('internlink.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* private mode — fall back to the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>JavaScript is required</h1>
        <p>InternLink needs JavaScript enabled to run. Please turn it on and reload.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
