# Render blueprint for the InternLink API.
#
# Render builds from the repo root because the API imports @internlink/shared-types
# from the npm workspace — building inside apps/backend/api alone cannot resolve
# it. `npm ci` at the root installs every workspace, then build:packages compiles
# shared-types before the API is compiled against it. Order matters.
#
# Deploy: connect the repo in the Render dashboard and point it at this file
# (New → Blueprint). Secrets marked `sync: false` must be filled in there —
# they are deliberately not in the repo.

services:
  - type: web
    name: internlink-api
    runtime: node
    plan: starter
    region: frankfurt # Closest Render region to the Nigerian launch market (§2.5).
    rootDir: .
    buildCommand: npm ci && npm run build:packages && npm run build -w @internlink/api
    startCommand: node apps/backend/api/dist/index.js

    # Render restarts an instance that fails this, so it must not depend on
    # Firestore being reachable — /v1/health reports `degraded` rather than
    # failing when an integration is down, which is exactly the behaviour a
    # health check wants.
    healthCheckPath: /v1/health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: v1

      # Render injects PORT; app.ts reads it through the validated env schema.
      - key: PORT
        value: 10000

      # The browser is cross-origin against this service (the app is on Firebase
      # Hosting), so these must be exact. No trailing slashes.
      - key: CORS_ORIGINS
        value: https://intern-project-38829.web.app,https://intern-project-38829.firebaseapp.com

      - key: FIREBASE_PROJECT_ID
        value: intern-project-38829

      # Where the app lives. Used to build share links and to bounce a share
      # page visitor into the app, so it must be the canonical public origin.
      - key: WEB_APP_ORIGIN
        value: https://intern-project-38829.web.app

      # --- secrets: set these in the Render dashboard, never in the repo -----
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        # Paste the PEM with literal \n escapes on one line — config/env.ts
        # restores the newlines. A key with real line breaks will not parse.
        sync: false

      # Public half of the Web Push VAPID pair (Firebase console → Project
      # settings → Cloud Messaging → Web Push certificates). Public by design —
      # it ships to browsers. Without it the notifications switch stays hidden.
      - key: FIREBASE_VAPID_KEY
        sync: false

      # Shared secret for the scheduled jobs below. Without it those routes
      # refuse every call rather than falling open.
      - key: CRON_SECRET
        generateValue: true

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Unsigned preset — enables feed photo/video upload without a secret.
      - key: CLOUDINARY_UPLOAD_PRESET
        value: internlink

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: InternLink <noreply@internlink.app>

      # FR-1102 outreach caps.
      - key: MAX_CONNECTION_REQUESTS_PER_DAY
        value: 40
      - key: MAX_COLD_MESSAGES_PER_DAY
        value: 15
      - key: NEW_ACCOUNT_RESTRICTION_HOURS
        value: 24

  # ---------------------------------------------------------------------------
  # FR-604 — the "you have missed this" nudge for dormant accounts.
  #
  # A cron job rather than anything in-process: the web service is a request
  # handler and may be running on several instances or asleep on a free plan,
  # neither of which can be trusted to fire a daily sweep exactly once.
  #
  # 09:00 UTC is 10:00 in Lagos — inside waking hours for the launch market
  # (§2.5), which matters more for a re-engagement push than for anything else
  # we send. CRON_SECRET must match the web service's; Render does not share a
  # generated value across services, so set it by hand on both.
  # ---------------------------------------------------------------------------
  - type: cron
    name: internlink-reengagement
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    schedule: '0 9 * * *'
    buildCommand: npm ci
    startCommand: >-
      curl -sS -f -X POST "$API_BASE_URL/v1/notifications/jobs/reengagement"
      -H "content-type: application/json"
      -H "x-cron-secret: $CRON_SECRET"
      -d '{"inactiveDays":7,"limit":200}'
    envVars:
      - key: API_BASE_URL
        value: https://internlink-2g0u.onrender.com
      - key: CRON_SECRET
        sync: false
