name: Deploy

# Manual by default, plus automatic on a push to main once you are happy with
# that. Deploying Firestore *rules* automatically is the risky half — a bad
# ruleset locks every user out instantly — so rules are gated behind the manual
# trigger and only hosting ships on a push.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_rules:
        description: 'Also deploy Firestore rules and indexes'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false # Never cancel a deploy midway.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTERN_PROJECT_38829 || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build:packages
      - run: npm test

      - name: Build web app
        run: npm run build:web
        env:
          # Points the browser at the Render API. Set as a repository variable
          # (Settings → Secrets and variables → Actions → Variables).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://internlink-api.onrender.com/v1' }}
          # Firebase's browser config lives in apps/web/.env.production. These
          # values are public, and omitting them here avoids empty GitHub
          # variables overriding the checked-in production config.

      - name: Check Firebase deploy secret
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error title=Missing Firebase service-account secret::Add repository secret FIREBASE_SERVICE_ACCOUNT_INTERN_PROJECT_38829 in GitHub Actions. Paste the full service-account JSON as the value."
            exit 1
          fi

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Generate with: firebase init hosting:github, which creates the
          # project-specific secret name below. FIREBASE_SERVICE_ACCOUNT is kept
          # as a local/manual fallback if you prefer a shorter secret name.
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: intern-project-38829
          channelId: live

      - name: Deploy Firestore rules and indexes
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_rules
        run: |
          # The CLI authenticates from a key file on disk, so the secret is
          # written out, used, and deleted in the same step — it never survives
          # into a later one.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i -g firebase-tools
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project intern-project-38829 \
            --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

# NOTE: the API is not deployed here. Render watches the repo itself
# (autoDeploy: true in render.yaml) and redeploys on push to main.
